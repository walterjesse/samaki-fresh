{% extends 'partials/base.html' %} {% load static %}

{% block content %}
<section>
    <div class="max-w-2xl rounded-[28px] border border-slate-200 bg-white p-5 sm:p-6">
        <h1 class="font-display text-[24px] text-slate-900 mb-6">Add New Address</h1>

        <form method="POST" class="grid grid-cols-1 gap-4">
            {% csrf_token %}
            <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Full Name</label>
                    <input type="text" name="full_name" value="{{ user.profile.full_name }}" placeholder="John Doe" class="h-11 w-full rounded-xl border border-slate-200 px-3 text-sm outline-none focus:border-teal-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Phone Number</label>
                    <input type="tel" name="mobile" value="{{ user.profile.mobile }}" placeholder="07XX XXX XXX" class="h-11 w-full rounded-xl border border-slate-200 px-3 text-sm outline-none focus:border-teal-500">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                <input type="email" name="email" value="{{ user.email }}" placeholder="john@example.com" class="h-11 w-full rounded-xl border border-slate-200 px-3 text-sm outline-none focus:border-teal-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Country</label>
                <input type="text" name="country" value="Kenya" readonly class="h-11 w-full rounded-xl border border-slate-200 px-3 text-sm outline-none focus:border-teal-500 bg-slate-50">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">County</label>
                <select name="state" class="h-11 w-full rounded-xl border border-slate-200 px-3 text-sm outline-none focus:border-teal-500">
                    <option value="">Select County</option>
                    <option value="Nairobi">Nairobi</option>
                    <option value="Mombasa">Mombasa</option>
                    <option value="Kisumu">Kisumu</option>
                    <option value="Nakuru">Nakuru</option>
                    <option value="Eldoret">Eldoret</option>
                    <option value="Kiambu">Kiambu</option>
                    <option value="Machakos">Machakos</option>
                    <option value="Kajiado">Kajiado</option>
                    <option value="Meru">Meru</option>
                    <option value="Kakamega">Kakamega</option>
                    <option value="Bungoma">Bungoma</option>
                    <option value="Busia">Busia</option>
                    <option value="Siaya">Siaya</option>
                    <option value="Homa Bay">Homa Bay</option>
                    <option value="Migori">Migori</option>
                    <option value="Kisii">Kisii</option>
                    <option value="Nyamira">Nyamira</option>
                    <option value="Nyandarua">Nyandarua</option>
                    <option value="Nyeri">Nyeri</option>
                    <option value="Kirinyaga">Kirinyaga</option>
                    <option value="Murang'a">Murang'a</option>
                    <option value="Kiambu">Kiambu</option>
                    <option value="Turkana">Turkana</option>
                    <option value="West Pokot">West Pokot</option>
                    <option value="Samburu">Samburu</option>
                    <option value="Trans Nzoia">Trans Nzoia</option>
                    <option value="Uasin Gishu">Uasin Gishu</option>
                    <option value="Elgeyo Marakwet">Elgeyo Marakwet</option>
                    <option value="Nandi">Nandi</option>
                    <option value="Baringo">Baringo</option>
                    <option value="Laikipia">Laikipia</option>
                    <option value="Nakuru">Nakuru</option>
                    <option value="Narok">Narok</option>
                    <option value="Kajiado">Kajiado</option>
                    <option value="Makueni">Makueni</option>
                    <option value="Machakos">Machakos</option>
                    <option value="Kitui">Kitui</option>
                    <option value="Embu">Embu</option>
                    <option value="Tharaka Nithi">Tharaka Nithi</option>
                    <option value="Meru">Meru</option>
                    <option value="Isiolo">Isiolo</option>
                    <option value="Marsabit">Marsabit</option>
                    <option value="Garissa">Garissa</option>
                    <option value="Wajir">Wajir</option>
                    <option value="Mandera">Mandera</option>
                    <option value="Lamu">Lamu</option>
                    <option value="Tana River">Tana River</option>
                    <option value="Kilifi">Kilifi</option>
                    <option value="Kwale">Kwale</option>
                    <option value="Taita Taveta">Taita Taveta</option>
                    <option value="Vihiga">Vihiga</option>
                    <option value="Bungoma">Bungoma</option>
                    <option value="Busia">Busia</option>
                    <option value="Kakamega">Kakamega</option>
                    <option value="Kisumu">Kisumu</option>
                    <option value="Siaya">Siaya</option>
                    <option value="Homa Bay">Homa Bay</option>
                    <option value="Migori">Migori</option>
                    <option value="Kisii">Kisii</option>
                    <option value="Nyamira">Nyamira</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">City/Town</label>
                <input type="text" name="city" placeholder="e.g., Nairobi CBD" class="h-11 w-full rounded-xl border border-slate-200 px-3 text-sm outline-none focus:border-teal-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Street Address</label>
                <input type="text" name="address" placeholder="123 Main Street" class="h-11 w-full rounded-xl border border-slate-200 px-3 text-sm outline-none focus:border-teal-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Postal/Zip Code</label>
                <input type="text" name="zip_code" placeholder="00100" class="h-11 w-full rounded-xl border border-slate-200 px-3 text-sm outline-none focus:border-teal-500">
            </div>
            <div class="flex gap-3 mt-4">
                <a href="{% url 'customer:addresses' %}" class="h-11 flex-1 rounded-xl border border-slate-200 text-[15px] font-semibold text-slate-700 hover:bg-slate-50">Cancel</a>
                <button type="submit" class="h-11 flex-1 rounded-xl bg-teal-600 text-[15px] font-semibold text-white hover:bg-teal-700">Save Address</button>
            </div>
        </form>
    </div>
</section>
{% endblock %}
