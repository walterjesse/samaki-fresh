{% extends 'partials/base.html' %} {% load static %}

{% block content %}
<section>
    <div class="max-w-2xl rounded-[28px] border border-slate-200 bg-white p-5 sm:p-6">
        <h1 class="font-display text-[24px] text-slate-900 mb-6">Edit Address</h1>

        <form method="POST" class="grid grid-cols-1 gap-4">
            {% csrf_token %}
            <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Full Name</label>
                    <input type="text" name="full_name" value="{{ address.full_name }}" placeholder="John Doe" class="h-11 w-full rounded-xl border border-slate-200 px-3 text-sm outline-none focus:border-teal-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Phone Number</label>
                    <input type="tel" name="mobile" value="{{ address.mobile }}" placeholder="07XX XXX XXX" class="h-11 w-full rounded-xl border border-slate-200 px-3 text-sm outline-none focus:border-teal-500">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                <input type="email" name="email" value="{{ address.email }}" placeholder="john@example.com" class="h-11 w-full rounded-xl border border-slate-200 px-3 text-sm outline-none focus:border-teal-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Country</label>
                <input type="text" name="country" value="{{ address.country|default:'Kenya' }}" readonly class="h-11 w-full rounded-xl border border-slate-200 px-3 text-sm outline-none focus:border-teal-500 bg-slate-50">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">County</label>
                <select name="state" class="h-11 w-full rounded-xl border border-slate-200 px-3 text-sm outline-none focus:border-teal-500">
                    <option value="">Select County</option>
                    <option value="Nairobi" {% if address.state == 'Nairobi' %}selected{% endif %}>Nairobi</option>
                    <option value="Mombasa" {% if address.state == 'Mombasa' %}selected{% endif %}>Mombasa</option>
                    <option value="Kisumu" {% if address.state == 'Kisumu' %}selected{% endif %}>Kisumu</option>
                    <option value="Nakuru" {% if address.state == 'Nakuru' %}selected{% endif %}>Nakuru</option>
                    <option value="Eldoret" {% if address.state == 'Eldoret' %}selected{% endif %}>Eldoret</option>
                    <option value="Kiambu" {% if address.state == 'Kiambu' %}selected{% endif %}>Kiambu</option>
                    <option value="Machakos" {% if address.state == 'Machakos' %}selected{% endif %}>Machakos</option>
                    <option value="Kajiado" {% if address.state == 'Kajiado' %}selected{% endif %}>Kajiado</option>
                    <option value="Meru" {% if address.state == 'Meru' %}selected{% endif %}>Meru</option>
                    <option value="Kakamega" {% if address.state == 'Kakamega' %}selected{% endif %}>Kakamega</option>
                    <option value="Bungoma" {% if address.state == 'Bungoma' %}selected{% endif %}>Bungoma</option>
                    <option value="Busia" {% if address.state == 'Busia' %}selected{% endif %}>Busia</option>
                    <option value="Siaya" {% if address.state == 'Siaya' %}selected{% endif %}>Siaya</option>
                    <option value="Homa Bay" {% if address.state == 'Homa Bay' %}selected{% endif %}>Homa Bay</option>
                    <option value="Migori" {% if address.state == 'Migori' %}selected{% endif %}>Migori</option>
                    <option value="Kisii" {% if address.state == 'Kisii' %}selected{% endif %}>Kisii</option>
                    <option value="Nyamira" {% if address.state == 'Nyamira' %}selected{% endif %}>Nyamira</option>
                    <option value="Nyandarua" {% if address.state == 'Nyandarua' %}selected{% endif %}>Nyandarua</option>
                    <option value="Nyeri" {% if address.state == 'Nyeri' %}selected{% endif %}>Nyeri</option>
                    <option value="Kirinyaga" {% if address.state == 'Kirinyaga' %}selected{% endif %}>Kirinyaga</option>
                    <option value="Murang'a" {% if address.state == 'Murang\'a' %}selected{% endif %}>Murang'a</option>
                    <option value="Turkana" {% if address.state == 'Turkana' %}selected{% endif %}>Turkana</option>
                    <option value="West Pokot" {% if address.state == 'West Pokot' %}selected{% endif %}>West Pokot</option>
                    <option value="Samburu" {% if address.state == 'Samburu' %}selected{% endif %}>Samburu</option>
                    <option value="Trans Nzoia" {% if address.state == 'Trans Nzoia' %}selected{% endif %}>Trans Nzoia</option>
                    <option value="Uasin Gishu" {% if address.state == 'Uasin Gishu' %}selected{% endif %}>Uasin Gishu</option>
                    <option value="Elgeyo Marakwet" {% if address.state == 'Elgeyo Marakwet' %}selected{% endif %}>Elgeyo Marakwet</option>
                    <option value="Nandi" {% if address.state == 'Nandi' %}selected{% endif %}>Nandi</option>
                    <option value="Baringo" {% if address.state == 'Baringo' %}selected{% endif %}>Baringo</option>
                    <option value="Laikipia" {% if address.state == 'Laikipia' %}selected{% endif %}>Laikipia</option>
                    <option value="Narok" {% if address.state == 'Narok' %}selected{% endif %}>Narok</option>
                    <option value="Makueni" {% if address.state == 'Makueni' %}selected{% endif %}>Makueni</option>
                    <option value="Kitui" {% if address.state == 'Kitui' %}selected{% endif %}>Kitui</option>
                    <option value="Embu" {% if address.state == 'Embu' %}selected{% endif %}>Embu</option>
                    <option value="Tharaka Nithi" {% if address.state == 'Tharaka Nithi' %}selected{% endif %}>Tharaka Nithi</option>
                    <option value="Isiolo" {% if address.state == 'Isiolo' %}selected{% endif %}>Isiolo</option>
                    <option value="Marsabit" {% if address.state == 'Marsabit' %}selected{% endif %}>Marsabit</option>
                    <option value="Garissa" {% if address.state == 'Garissa' %}selected{% endif %}>Garissa</option>
                    <option value="Wajir" {% if address.state == 'Wajir' %}selected{% endif %}>Wajir</option>
                    <option value="Mandera" {% if address.state == 'Mandera' %}selected{% endif %}>Mandera</option>
                    <option value="Lamu" {% if address.state == 'Lamu' %}selected{% endif %}>Lamu</option>
                    <option value="Tana River" {% if address.state == 'Tana River' %}selected{% endif %}>Tana River</option>
                    <option value="Kilifi" {% if address.state == 'Kilifi' %}selected{% endif %}>Kilifi</option>
                    <option value="Kwale" {% if address.state == 'Kwale' %}selected{% endif %}>Kwale</option>
                    <option value="Taita Taveta" {% if address.state == 'Taita Taveta' %}selected{% endif %}>Taita Taveta</option>
                    <option value="Vihiga" {% if address.state == 'Vihiga' %}selected{% endif %}>Vihiga</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">City/Town</label>
                <input type="text" name="city" value="{{ address.city }}" placeholder="e.g., Nairobi CBD" class="h-11 w-full rounded-xl border border-slate-200 px-3 text-sm outline-none focus:border-teal-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Street Address</label>
                <input type="text" name="address" value="{{ address.address }}" placeholder="123 Main Street" class="h-11 w-full rounded-xl border border-slate-200 px-3 text-sm outline-none focus:border-teal-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Postal/Zip Code</label>
                <input type="text" name="zip_code" value="{{ address.zip_code }}" placeholder="00100" class="h-11 w-full rounded-xl border border-slate-200 px-3 text-sm outline-none focus:border-teal-500">
            </div>
            <div class="flex gap-3 mt-4">
                <a href="{% url 'customer:addresses' %}" class="h-11 flex-1 rounded-xl border border-slate-200 text-[15px] font-semibold text-slate-700 hover:bg-slate-50">Cancel</a>
                <button type="submit" class="h-11 flex-1 rounded-xl bg-teal-600 text-[15px] font-semibold text-white hover:bg-teal-700">Update Address</button>
            </div>
        </form>
    </div>
</section>
{% endblock %}
