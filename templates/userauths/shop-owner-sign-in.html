{% extends 'partials/base.html' %} {% load static %}

{% block content %}
<section class="min-h-[60vh] flex items-center justify-center py-12">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="font-display text-[32px] text-slate-900">Shop Owner Login</h1>
            <p class="text-sm text-slate-600 mt-2">Welcome to your shop dashboard.</p>
        </div>

        <form method="POST" class="rounded-[28px] border border-slate-200 bg-white p-6 sm:p-8">
            {% csrf_token %}
            <div class="space-y-4">
                <div>
                    <label class="text-[12px] font-medium uppercase tracking-wider text-slate-500">Email *</label>
                    {{ form.email }}
                </div>
                <div>
                    <label class="text-[12px] font-medium uppercase tracking-wider text-slate-500">Password *</label>
                    {{ form.password }}
                </div>
            </div>

            <button type="submit" class="mt-6 h-12 w-full rounded-xl bg-amber-600 text-[15px] font-semibold text-white shadow-sm shadow-amber-600/20 transition hover:bg-amber-700">
                Shop Owner Login
            </button>

            <div class="mt-4 flex items-center justify-between text-sm">
                <a href="{% url 'userauths:password_reset' %}" class="text-slate-600 hover:text-slate-900">Forgot password?</a>
            </div>

            <div class="mt-6 text-center text-sm text-slate-600">
                <a href="{% url 'userauths:sign-in' %}" class="font-medium text-teal-700 hover:underline">Customer Login</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
