{% extends 'partials/base.html' %} {% load static %}

{% block content %}
<section>
    <div class="mb-4">
        <h1 class="font-display text-[26px] text-slate-900">Edit Product</h1>
        <p class="text-sm text-slate-600">Update product details.</p>
    </div>

    <div class="max-w-2xl">
        <form method="POST" enctype="multipart/form-data" class="rounded-[28px] border border-slate-200 bg-white p-6 sm:p-8">
            {% csrf_token %}
            <div class="space-y-4">
                <div>
                    <label class="text-[12px] font-medium uppercase tracking-wider text-slate-500">Product Name *</label>
                    <input type="text" name="name" value="{{ product.name }}" required class="mt-1 h-11 w-full rounded-xl border border-slate-200 px-3 text-sm outline-none focus:border-teal-500">
                </div>

                <div>
                    <label class="text-[12px] font-medium uppercase tracking-wider text-slate-500">Description</label>
                    <textarea name="description" rows="4" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none focus:border-teal-500">{{ product.description }}</textarea>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[12px] font-medium uppercase tracking-wider text-slate-500">Price (KSh) *</label>
                        <input type="number" name="price" value="{{ product.price }}" required min="0" step="0.01" class="mt-1 h-11 w-full rounded-xl border border-slate-200 px-3 text-sm outline-none focus:border-teal-500">
                    </div>
                    <div>
                        <label class="text-[12px] font-medium uppercase tracking-wider text-slate-500">Regular Price (KSh)</label>
                        <input type="number" name="regular_price" value="{{ product.regular_price }}" min="0" step="0.01" class="mt-1 h-11 w-full rounded-xl border border-slate-200 px-3 text-sm outline-none focus:border-teal-500">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[12px] font-medium uppercase tracking-wider text-slate-500">Stock (kg) *</label>
                        <input type="number" name="stock" value="{{ product.stock }}" required min="0" class="mt-1 h-11 w-full rounded-xl border border-slate-200 px-3 text-sm outline-none focus:border-teal-500">
                    </div>
                    <div>
                        <label class="text-[12px] font-medium uppercase tracking-wider text-slate-500">Shipping (KSh)</label>
                        <input type="number" name="shipping" value="{{ product.shipping }}" min="0" step="0.01" class="mt-1 h-11 w-full rounded-xl border border-slate-200 px-3 text-sm outline-none focus:border-teal-500">
                    </div>
                </div>

                <div>
                    <label class="text-[12px] font-medium uppercase tracking-wider text-slate-500">Product Image</label>
                    <input type="file" name="image" accept="image/*" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none focus:border-teal-500">
                    {% if product.image %}
                    <img src="{{ product.image.url }}" alt="{{ product.name }}" class="mt-2 h-32 w-32 rounded-xl object-cover">
                    {% endif %}
                </div>

                <div>
                    <label class="text-[12px] font-medium uppercase tracking-wider text-slate-500">Status</label>
                    <select name="status" class="mt-1 h-11 w-full rounded-xl border border-slate-200 bg-white px-3 text-sm outline-none focus:border-teal-500">
                        <option value="Published" {% if product.status == 'Published' %}selected{% endif %}>Published</option>
                        <option value="Draft" {% if product.status == 'Draft' %}selected{% endif %}>Draft</option>
                        <option value="Disabled" {% if product.status == 'Disabled' %}selected{% endif %}>Disabled</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="mt-6 h-12 w-full rounded-xl bg-teal-600 text-[15px] font-semibold text-white shadow-sm shadow-teal-600/20 transition hover:bg-teal-700">
                Update Product
            </button>

            <div class="mt-4 text-center">
                <a href="{% url 'vendor:products' %}" class="text-sm text-slate-600 hover:text-slate-900">Cancel</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
