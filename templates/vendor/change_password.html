{% extends 'partials/base.html' %} {% load static %}

{% block content %}
<section>
    <div class="mb-4">
        <h1 class="font-display text-[26px] text-slate-900">Change Password</h1>
        <p class="text-sm text-slate-600">Update your account password.</p>
    </div>

    <div class="max-w-md">
        <form method="POST" class="rounded-[28px] border border-slate-200 bg-white p-6 sm:p-8">
            {% csrf_token %}
            <div class="space-y-4">
                <div>
                    <label class="text-[12px] font-medium uppercase tracking-wider text-slate-500">Current Password *</label>
                    <input type="password" name="old_password" required class="mt-1 h-11 w-full rounded-xl border border-slate-200 px-3 text-sm outline-none focus:border-teal-500">
                </div>
                <div>
                    <label class="text-[12px] font-medium uppercase tracking-wider text-slate-500">New Password *</label>
                    <input type="password" name="new_password" required class="mt-1 h-11 w-full rounded-xl border border-slate-200 px-3 text-sm outline-none focus:border-teal-500">
                    <p class="text-xs text-slate-500 mt-1">Minimum 6 characters</p>
                </div>
                <div>
                    <label class="text-[12px] font-medium uppercase tracking-wider text-slate-500">Confirm New Password *</label>
                    <input type="password" name="confirm_password" required class="mt-1 h-11 w-full rounded-xl border border-slate-200 px-3 text-sm outline-none focus:border-teal-500">
                </div>
            </div>

            <button type="submit" class="mt-6 h-12 w-full rounded-xl bg-teal-600 text-[15px] font-semibold text-white shadow-sm shadow-teal-600/20 transition hover:bg-teal-700">
                Change Password
            </button>

            <div class="mt-4 text-center">
                <a href="{% url 'vendor:profile' %}" class="text-sm text-slate-600 hover:text-slate-900">Cancel</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
